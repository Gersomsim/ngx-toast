<div class="flex min-h-screen bg-[#F5F4F0] dark:bg-[#0A0A0A] transition-colors duration-200">

  <!-- Sidebar -->
  <aside class="w-56 shrink-0 fixed h-screen flex flex-col
                bg-white dark:bg-[#111111]
                border-r border-slate-200 dark:border-slate-800/80
                z-20">

    <!-- Brand -->
    <div class="flex items-center gap-3 px-4 py-5
                border-b border-slate-200 dark:border-slate-800/80">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0
                  bg-slate-900 dark:bg-slate-100">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="6" height="6" class="fill-white dark:fill-slate-900" opacity="0.95"/>
          <rect x="9" y="1" width="6" height="6" class="fill-white dark:fill-slate-900" opacity="0.45"/>
          <rect x="1" y="9" width="6" height="6" class="fill-white dark:fill-slate-900" opacity="0.45"/>
          <rect x="9" y="9" width="6" height="6" class="fill-white dark:fill-slate-900" opacity="0.15"/>
        </svg>
      </div>
      <div class="flex flex-col gap-1 min-w-0">
        <span class="font-['JetBrains_Mono'] text-[13px] font-medium tracking-tight leading-none
                     text-slate-900 dark:text-slate-100">
          ngx-notify
        </span>
        <span class="font-['JetBrains_Mono'] text-[10px] leading-none
                     text-slate-400 dark:text-slate-600">
          &#64;gersomsim
        </span>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-4 flex flex-col gap-0.5 overflow-y-auto">
      <span class="text-[10px] font-semibold uppercase tracking-[0.09em] px-2.5 mb-2
                   text-slate-400 dark:text-slate-600">
        Documentation
      </span>

      <a routerLink="/"
         routerLinkActive="nav-active"
         [routerLinkActiveOptions]="{exact: true}"
         class="nav-link">
        <span class="w-1 h-1 rounded-full bg-current opacity-35 shrink-0"></span>
        Get Started
      </a>

      <a routerLink="/ngx-notify"
         routerLinkActive="nav-active"
         class="nav-link">
        <span class="w-1 h-1 rounded-full bg-current opacity-35 shrink-0"></span>
        ngx-notify
      </a>

      <a routerLink="/ngx-confirm"
         routerLinkActive="nav-active"
         class="nav-link">
        <span class="w-1 h-1 rounded-full bg-current opacity-35 shrink-0"></span>
        ngx-confirm
      </a>
    </nav>

    <!-- Footer -->
    <div class="px-3 py-3 flex flex-col gap-0.5
                border-t border-slate-200 dark:border-slate-800/80">

      <a href="https://github.com/gersomsim/ngx-notify"
         target="_blank"
         rel="noopener noreferrer"
         class="ext-link">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub
        <span class="ml-auto text-[10px] opacity-40">↗</span>
      </a>

      <a href="https://www.npmjs.com/package/@gersomsim/ngx-notify"
         target="_blank"
         rel="noopener noreferrer"
         class="ext-link">
        <svg width="13" height="13" viewBox="0 0 780 250" fill="currentColor">
          <path d="M0 250V0h250v250H150V50h-50v200zm280 0V0h250l-1 200h50V0h50v250z"/>
        </svg>
        npm
        <span class="ml-auto text-[10px] opacity-40">↗</span>
      </a>

      <!-- Dark mode toggle -->
      <button (click)="toggleDarkMode()"
              class="flex items-center gap-2 w-full px-2.5 py-1.5 rounded-md text-[12.5px] mt-1
                     text-slate-400 dark:text-slate-600
                     hover:text-slate-600 dark:hover:text-slate-400
                     hover:bg-slate-100 dark:hover:bg-slate-800/60
                     transition-[color,background-color] duration-100 cursor-pointer">
        @if (darkMode()) {
          <!-- Sun -->
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          Light mode
        } @else {
          <!-- Moon -->
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          Dark mode
        }
      </button>

    </div>
  </aside>

  <!-- Main content -->
  <main class="ml-56 flex-1 min-h-screen">
    <router-outlet />
  </main>

</div>
