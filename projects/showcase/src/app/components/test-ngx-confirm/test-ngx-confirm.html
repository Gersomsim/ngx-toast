<div [formGroup]="formConfirm"
     class="rounded-xl border border-slate-200 dark:border-slate-800
            bg-white dark:bg-slate-900/40 overflow-hidden">

  <!-- Header -->
  <div class="flex items-center gap-2.5 px-5 py-3.5
              border-b border-slate-100 dark:border-slate-800/80">
    <div class="w-1.5 h-1.5 rounded-full bg-emerald-400"></div>
    <span class="text-[12px] font-semibold text-slate-500 dark:text-slate-500 tracking-wide uppercase">
      Playground
    </span>
  </div>

  <!-- Body -->
  <div class="grid grid-cols-[1fr_1fr] divide-x divide-slate-100 dark:divide-slate-800/80">

    <!-- ── Left: controls ───────────────────────────────────── -->
    <div class="p-5 flex flex-col gap-5">

      <!-- Icon -->
      <div>
        <p class="field-label">Icon</p>
        <div class="flex flex-wrap gap-1.5">
          @for (ic of icons; track ic) {
            <button type="button"
                    (click)="formConfirm.patchValue({ icon: ic })"
                    [class]="formConfirm.get('icon')?.value === ic ? 'type-btn active' : 'type-btn'">
              <span [class]="'dot dot--' + ic"></span>
              {{ ic }}
            </button>
          }
        </div>
      </div>

      <!-- Text fields: title & timer -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label">Title</label>
          <input type="text" formControlName="title" class="field-input" placeholder="Are you sure?">
        </div>
        <div>
          <label class="field-label">Timer (ms)</label>
          <input type="number" formControlName="timer" class="field-input" placeholder="3000">
        </div>
      </div>

      <!-- Message -->
      <div>
        <label class="field-label">Message</label>
        <input type="text" formControlName="message" class="field-input" placeholder="Confirm delete this item?">
      </div>

      <!-- Button texts -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label">Confirm text</label>
          <input type="text" formControlName="confirmText" class="field-input" placeholder="Yes, delete it!">
        </div>
        <div>
          <label class="field-label">Cancel text</label>
          <input type="text" formControlName="cancelText" class="field-input" placeholder="No">
        </div>
      </div>

      <!-- Toggles -->
      <div class="flex items-center gap-5 pt-1 flex-wrap">

        <label class="toggle-wrap">
          <div class="relative">
            <input type="checkbox" formControlName="showConfirmButton" class="sr-only peer">
            <div class="toggle-track peer-checked:toggle-track--on"></div>
            <div class="toggle-thumb peer-checked:translate-x-3.5"></div>
          </div>
          <span class="toggle-label">Confirm button</span>
        </label>

        <label class="toggle-wrap">
          <div class="relative">
            <input type="checkbox" formControlName="showCancelButton" class="sr-only peer">
            <div class="toggle-track peer-checked:toggle-track--on"></div>
            <div class="toggle-thumb peer-checked:translate-x-3.5"></div>
          </div>
          <span class="toggle-label">Cancel button</span>
        </label>

        <label class="toggle-wrap">
          <div class="relative">
            <input type="checkbox" formControlName="showTimerProgressBar" class="sr-only peer">
            <div class="toggle-track peer-checked:toggle-track--on"></div>
            <div class="toggle-thumb peer-checked:translate-x-3.5"></div>
          </div>
          <span class="toggle-label">Progress bar</span>
        </label>

        <label class="toggle-wrap">
          <div class="relative">
            <input type="checkbox" formControlName="closeBackdropClick" class="sr-only peer">
            <div class="toggle-track peer-checked:toggle-track--on"></div>
            <div class="toggle-thumb peer-checked:translate-x-3.5"></div>
          </div>
          <span class="toggle-label">Backdrop click</span>
        </label>

      </div>

    </div>

    <!-- ── Right: code preview + actions ────────────────────── -->
    <div class="p-5 flex flex-col gap-4">

      <div>
        <p class="field-label">Generated code</p>
        <ui-code-block [code]="configCode()" filename="example.ts" />
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2 mt-auto pt-1">
        <button type="button"
                (click)="testConfirm()"
                class="flex-1 px-4 py-2 rounded-lg text-[13px] font-medium cursor-pointer
                       bg-slate-900 dark:bg-slate-100
                       text-white dark:text-slate-900
                       hover:opacity-80 transition-opacity">
          Show confirm
        </button>

        <button type="button"
                (click)="copyConfig()"
                class="px-4 py-2 rounded-lg text-[13px] font-medium cursor-pointer
                       border border-slate-200 dark:border-slate-700
                       text-slate-600 dark:text-slate-400
                       hover:bg-slate-50 dark:hover:bg-slate-800/60
                       transition-colors min-w-[110px] text-center">
          {{ copied() ? '✓ Copied' : 'Copy config' }}
        </button>
      </div>

    </div>
  </div>

</div>
