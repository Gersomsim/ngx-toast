<div [class]="cssClass()">
  @if(withIcon()) {
    <gsm-notify-icon class="notify-icon" [type]="type()" />
  }
  @if(withCloseButton()) {
    <button class="notify-close" (click)="close()">X</button>
  }
  <div class="notify-content">
    @if(title()) {
      <p class="notify-title">{{ title() }}</p>
    }
    <p class="notify-message">{{ message() }}</p>
  </div>
</div>
