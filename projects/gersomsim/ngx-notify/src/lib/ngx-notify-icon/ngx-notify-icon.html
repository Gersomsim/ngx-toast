<svg
  class="notify-icon-svg"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  @switch (type()) {

    @case ('info') {
      <circle class="icon-circle" cx="12" cy="12" r="10" />
      <line class="icon-body" x1="12" y1="16" x2="12" y2="12" />
      <line class="icon-dot" x1="12" y1="8" x2="12.01" y2="8" />
    }

    @case ('success') {
      <circle class="icon-circle" cx="12" cy="12" r="10" />
      <polyline class="icon-check" points="9 12 11 14 15 10" />
    }

    @case ('warning') {
      <path class="icon-triangle" d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
      <line class="icon-body" x1="12" y1="9" x2="12" y2="13" />
      <line class="icon-dot" x1="12" y1="17" x2="12.01" y2="17" />
    }

    @case ('error') {
      <circle class="icon-circle" cx="12" cy="12" r="10" />
      <line class="icon-x1" x1="15" y1="9" x2="9" y2="15" />
      <line class="icon-x2" x1="9" y1="9" x2="15" y2="15" />
    }

  }
</svg>
